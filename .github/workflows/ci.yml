name: CI

on:
  push:
    branches: [master, main, develop]
  pull_request:
    branches: [master, main]

jobs:
  check:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install frontend deps
        working-directory: src-frontend
        run: npm ci

      - name: Svelte check
        working-directory: src-frontend
        run: npx svelte-check --tsconfig ./tsconfig.json 2>&1 | tail -5

      - name: Install Rust 1.92.0
        # Pinned so new clippy lints or compiler changes only land on a deliberate bump.
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.92.0
          components: clippy

      - name: Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libayatana-appindicator3-dev \
            librsvg2-dev patchelf libssl-dev pkg-config

      - name: Fetch monero-wallet-rpc
        shell: bash
        run: scripts/fetch-wallet-rpc.sh x86_64-unknown-linux-gnu

      - name: cargo check
        run: cargo check --workspace

      - name: cargo clippy (warnings as errors)
        run: cargo clippy --workspace -- -D warnings

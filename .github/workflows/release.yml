name: Release

# Triggered manually or on version tag push
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Version tag (e.g. v0.2.0)'
        required: false
        default: 'v0.2.0-dev'

permissions:
  contents: write   # needed to create GitHub Releases

jobs:
  # ─────────────────────────────────────────────
  # Desktop: Linux (AppImage + deb), Windows (nsis + msi), macOS (dmg + app)
  # ─────────────────────────────────────────────
  build-desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux x86_64
          - platform: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            label: linux-x64
            args: '--target x86_64-unknown-linux-gnu'

          # Windows x64
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            label: windows-x64
            args: '--target x86_64-pc-windows-msvc'

          # macOS Apple Silicon
          - platform: macos-latest
            target: aarch64-apple-darwin
            label: macos-arm64
            args: '--target aarch64-apple-darwin'

          # macOS Intel
          - platform: macos-latest
            target: x86_64-apple-darwin
            label: macos-x64
            args: '--target x86_64-apple-darwin'

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      # ── Node + pnpm ──────────────────────────
      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install frontend deps
        working-directory: src-frontend
        run: npm ci

      # ── Rust toolchain ────────────────────────
      - name: Install Rust 1.92.0
        # Pinned so new clippy lints or compiler changes only land on a deliberate bump.
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.92.0
          targets: ${{ matrix.target }}

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      # ── Linux system deps ─────────────────────
      - name: Linux system dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev \
            pkg-config

      # ── Bundled monero-wallet-rpc (pinned + SHA-256 checked) ──
      - name: Fetch monero-wallet-rpc
        shell: bash
        run: scripts/fetch-wallet-rpc.sh ${{ matrix.target }}

      # ── macOS signing (only when the secrets exist) ──
      # Tauri tries to import APPLE_CERTIFICATE as soon as the variable is defined, even empty,
      # so it is exported only when set. Without it the app is ad-hoc signed (tauri.conf.json).
      - name: macOS signing secrets
        if: startsWith(matrix.platform, 'macos')
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ -n "$APPLE_CERTIFICATE" ]; then
            for v in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
              if [ -n "${!v}" ]; then
                { echo "$v<<__EOF__"; echo "${!v}"; echo "__EOF__"; } >> "$GITHUB_ENV"
              fi
            done
            echo "Developer ID signing enabled"
          else
            echo "No APPLE_CERTIFICATE secret: ad-hoc signing"
          fi

      # ── Build Tauri app ───────────────────────
      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.event.inputs.tag || github.ref_name }}
          releaseName: 'Crypto AutoPay ${{ github.event.inputs.tag || github.ref_name }}'
          releaseBody: |
            ## Crypto AutoPay ${{ github.event.inputs.tag || github.ref_name }}

            ### Téléchargements / Downloads
            | Plateforme | Fichier |
            |---|---|
            | 🐧 Linux | `.AppImage` (portable) ou `.deb` |
            | 🪟 Windows | `.msi` (recommandé) ou `.exe` (NSIS) |
            | 🍎 macOS Apple Silicon | `.dmg` (M1/M2/M3) |
            | 🍎 macOS Intel | `.dmg` (x86_64) |

            ### Changelog
            See [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/master/CHANGELOG.md)
          releaseDraft: true
          prerelease: false
          projectPath: '.'
          args: ${{ matrix.args }}

[workspace]
resolver = "2"
members = [
    "crates/autopay-core",
    "crates/autopay-crypto",
    "crates/autopay-rpc",
    "src-tauri",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Monero AutoPay Contributors"]
license = "GPL-3.0"
repository = "https://github.com/TODO/monero-autopay"

[workspace.dependencies]
# Async runtime
tokio = { version = "1", features = ["full"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Crypto
aes-gcm = "0.10"
argon2 = "0.5"
ed25519-dalek = { version = "2", features = ["rand_core"] }
blake3 = "1"
rand = "0.8"
zeroize = { version = "1", features = ["derive"] }
getrandom = { version = "0.2", features = ["std"] }
base64 = "0.22"
hex = "0.4"

# HTTP client (for canary, RPC)
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }

# Database
rusqlite = { version = "0.32", features = ["bundled"] }

# Scheduling
tokio-cron-scheduler = "0.13"

# Error handling
thiserror = "2"
anyhow = "1"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

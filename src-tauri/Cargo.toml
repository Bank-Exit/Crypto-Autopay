[package]
name = "monero-autopay"
version = "0.2.0"
description = "Non-custodial recurring Monero payments"
authors = ["Monero AutoPay Contributors"]
license = "GPL-3.0"
repository = "https://github.com/TODO/monero-autopay"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4"] }
tauri = { version = "2.12.5", features = [] }
tauri-plugin-log = "2"
tauri-plugin-shell = "2"
tokio = { version = "1", features = ["full"] }

autopay-core  = { path = "../crates/autopay-core" }
autopay-crypto = { path = "../crates/autopay-crypto" }
autopay-rpc   = { path = "../crates/autopay-rpc" }
tauri-plugin-deep-link = "=2.3.0"
tauri-plugin-single-instance = "2.5.4"
